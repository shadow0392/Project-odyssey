<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Odyssey</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="ship-interface">

    <header class="top-bar">
        <h1>PROJECT ODYSSEY</h1>
        <p>The First Warp</p>
    </header>


    <main id="room-view">

        <section id="engineering-room" class="room active">

            <div class="door-label">
                ENGINEERING
            </div>


            <div class="warp-core">

                <div class="plasma">
                </div>

                <div class="core-ring">
                </div>

            </div>


            <div class="engineering-status">

                <div>
                    TIMELINE:
                    <span id="timeline-display">0</span>
                </div>

                <div>
                    ENERGY:
                    <span id="energy-display">0</span>
                </div>

                <div>
                    OUTPUT:
                    <span id="production-display">1</span>/sec
                </div>

            </div>

        </section>


        <section id="timeline-room" class="room hidden">

            <div class="timeline-panel">

                <h2>TIMELINE CONTROL</h2>

                <p>
                    Current Timeline:
                    <span id="timeline-display-2">0</span>
                </p>

                <p>
                    Temporal Knowledge:
                    <span id="knowledge-display">0</span>
                </p>

                <p>
                    Energy Required:
                    <span id="prestige-cost">5000</span>
                </p>

                <p>
                    Current Energy:
                    <span id="timeline-energy">0</span>
                </p>


                <button onclick="prestige()">
                    RESTORE TIMELINE
                </button>

            </div>

        </section>


    </main>



    <section class="engineering-console">

        <h2>ENGINEERING CONSOLE</h2>


        <div class="upgrade">

            <h3>Auxiliary Batteries</h3>

            <p>
                Level:
                <span id="battery-level">0</span>
            </p>

            <button onclick="buyBattery()">
                INSTALL
            </button>

        </div>



        <div class="upgrade">

            <h3>Fusion Generator</h3>

            <p>
                Level:
                <span id="generator-level">0</span>
            </p>

            <button onclick="buyGenerator()">
                UPGRADE
            </button>

        </div>


    </section>



    <nav class="location-tabs">

        <button onclick="openRoom('engineering-room')">
            ⚙
            <span>Engineering</span>
        </button>


        <button class="locked">
            🔒
            <span>Bridge</span>
        </button>


        <button class="locked">
            🔒
            <span>Personnel</span>
        </button>


        <button class="locked">
            🔒
            <span>Science</span>
        </button>


        <button onclick="openRoom('timeline-room')">
            ⏳
            <span>Timeline</span>
        </button>


    </nav>


</div>


<script src="script.js"></script>

</body>
</html>
